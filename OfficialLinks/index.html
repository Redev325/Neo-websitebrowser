<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>Official Links | neo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0b0b0d;color:#f5f5f6;font-family:Quicksand,Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .topbar{height:68px;display:flex;align-items:center;padding:0 28px}
    .brand{display:inline-flex;width:46px;height:46px;align-items:center;justify-content:center}
    .brand img{width:46px;height:46px;object-fit:contain;display:block}
    main{width:min(100% - 40px,620px);margin:0 auto;padding:90px 0}
    .links{display:flex;flex-direction:column;gap:14px}
    .link{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 20px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:#151518;color:#f5f5f6;text-decoration:none;font-size:15px;font-weight:700;overflow-wrap:anywhere;transition:border-color .18s ease,background .18s ease,transform .18s ease}
    .link:hover{border-color:#ef343c;background:#1b1416;transform:translateY(-2px)}
    .arrow{flex:0 0 auto;color:#999;font-size:18px}
    .link:hover .arrow{color:#ef343c}
    @media(max-width:520px){.topbar{padding:0 18px}main{padding-top:64px}.link{font-size:13px;padding:16px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Neo home">
      <img src="/assets/neo-logo-diamond.png" alt="Neo">
    </a>
  </header>
  <main>
    <nav class="links" aria-label="Official links">
      <a class="link" href="https://neo.pntr.dev/OfficialLinks/?utm_source=chatgpt.com">
        <span>neo.pntr.dev</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://neofeedertermitesonsomething.base44.app" target="_blank" rel="noopener noreferrer">
        <span>neofeedertermitesonsomething.base44.app</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>
</body>
</html>
