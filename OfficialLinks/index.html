<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>Official Links | neo</title>
  <style>
    :root{color-scheme:dark;--accent:#ef343c;--bg:#0b0b0d;--panel:#151518;--muted:#a3a3aa;--line:rgba(255,255,255,.10)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(239,52,60,.13),transparent 52%),var(--bg);color:#f5f5f6;font-family:Quicksand,Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    .topbar{height:72px;display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1040px)/2));border-bottom:1px solid rgba(255,255,255,.06);background:rgba(11,11,13,.65);backdrop-filter:blur(14px)}
    .brand{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
    .brand img{width:46px;height:46px;display:block;object-fit:contain}
    main{width:min(100% - 40px,720px);margin:0 auto;padding:76px 0 100px}
    .eyebrow{display:flex;align-items:center;gap:9px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(239,52,60,.8)}
    h1{font-size:clamp(36px,7vw,54px);font-weight:900;letter-spacing:-2px;line-height:1.05;margin:17px 0 12px}
    .subtitle{margin:0 0 34px;color:var(--muted);font-size:14px;line-height:1.6}
    .links{display:grid;grid-template-columns:1fr;gap:14px}
    .link-card{min-height:94px;display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(120deg,rgba(255,255,255,.045),rgba(255,255,255,.018));transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease}
    .link-card:hover{transform:translateY(-3px);border-color:rgba(239,52,60,.85);background:linear-gradient(120deg,rgba(239,52,60,.10),rgba(255,255,255,.02));box-shadow:0 0 0 1px rgba(239,52,60,.16),0 12px 28px rgba(239,52,60,.12)}
    .link-icon{width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;background:rgba(239,52,60,.13);color:var(--accent)}
    .link-icon svg{width:21px;height:21px}
    .link-copy{min-width:0;flex:1}
    .link-copy strong{display:block;font-size:15px;font-weight:800;margin-bottom:5px;overflow-wrap:anywhere}
    .link-copy small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
    .arrow{flex:0 0 auto;color:#85858d;font-size:20px;transition:transform .2s ease,color .2s ease}
    .link-card:hover .arrow{color:var(--accent);transform:translate(3px,-3px)}
    footer{border-top:1px solid rgba(255,255,255,.06);padding:20px;text-align:center;color:#777780;font-size:11px}
    @media(max-width:600px){.topbar{padding:0 18px}main{padding:58px 0 76px}.link-card{padding:16px}.link-copy strong{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Neo home">
      <img src="/assets/neo-logo-diamond.png" alt="Neo">
    </a>
  </header>
  <main>
    <div class="eyebrow">Neo directory</div>
    <h1>Official Links</h1>
    <p class="subtitle">Official Neo destinations.</p>
    <nav class="links" aria-label="Official links">
      <a class="link-card" href="https://neo.pntr.dev/OfficialLinks/?utm_source=chatgpt.com">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0Z"/><path d="M4 12h16M12 4a15 15 0 0 1 0 16M12 4a15 15 0 0 0 0 16"/></svg>
        </span>
        <span class="link-copy"><strong>neo.pntr.dev</strong><small>Official Neo website</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link-card" href="https://neofeedertermitesonsomething.base44.app" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M10 14 21 3"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
        </span>
        <span class="link-copy"><strong>neofeedertermitesonsomething.base44.app</strong><small>Neo on Base44</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>
  <footer>© <span id="year"></span> neo. All rights reserved.</footer>
  <script>document.getElementById('year').textContent=String(new Date().getFullYear());</script>
</body>
</html>
