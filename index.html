  var proto = XMLHttpRequest.prototype;
  var open = proto.open, setRequestHeader = proto.setRequestHeader, send = proto.send;
  var TOKEN_KEY = 'base44_access_token';
  var storedTokenHeader = function () {
    try { return 'Bearer ' + localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  };
  var forgetStoredToken = function () {
    try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('token'); } catch (e) {}
  };

  proto.open = function (method, url) {
    this.__b44IsAuthCheck = /\/entities\/User\/me(\?|$)/.test(url);
    return open.apply(this, arguments);
  };

  proto.setRequestHeader = function (name, value) {
    if (this.__b44IsAuthCheck && name.toLowerCase() === 'authorization' && value === storedTokenHeader()) {
      this.__b44SentToken = value;
    }
    return setRequestHeader.call(this, name, value);
  };

  proto.send = function () {
    this.addEventListener('loadend', function () {
      var rejectedTokenStillStored = this.status === 401 && this.__b44SentToken === storedTokenHeader();
      if (rejectedTokenStillStored) forgetStoredToken();
    });
    return send.apply(this, arguments);
  };
})();

  <style>
    html, body, * {
      cursor: none !important;
    }

    /* Soft ambient glow that follows the accent color */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 40%, hsl(var(--accent) / 0.14) 0%, transparent 55%);
    }

    /* Cursor – color applied dynamically via JS from --accent */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 58px;
      height: 58px;
      pointer-events: none;
      z-index: 2147483647;
      transform: translate(-50%, -50%);
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      animation: cursor-fade 1.6s ease-in-out infinite;
    }
    @keyframes cursor-fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (hover: none) {
      #custom-cursor { display: none !important; }
    }

    /* Concentric halo rings – expand outward from the cursor and fade in/out on loop */
    .cursor-halo-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      border: 1.5px solid hsl(var(--accent) / 0.85);
      box-shadow: 0 0 10px hsl(var(--accent) / 0.55);
      opacity: 0;
      pointer-events: none;
      animation: halo-expand 2.6s ease-out infinite;
    }
    .cursor-halo-ring.r2 { animation-delay: 0.87s; }
    .cursor-halo-ring.r3 { animation-delay: 1.74s; }
    @keyframes halo-expand {
      0% { transform: scale(0.3); opacity: 0; }
      14% { opacity: 0.8; }
      100% { transform: scale(3.2); opacity: 0; }
    }

    /* Particles */
    .cursor-particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2147483646;
      animation: particle-float 1s ease-out forwards;
    }
    @keyframes particle-float {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
    }

    /* Mouse trail */
    .cursor-trail-dot {
      position: fixed;

      animation: trail-fade 0.45s ease-out forwards;
      box-shadow: 0 0 4px hsl(var(--accent) / 0.6);
    }
    @keyframes trail-fade {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.25); }
    }

    /* Click burst */
    .click-burst-center {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, hsl(var(--accent)) 0%, hsl(var(--primary)) 70%, transparent 100%);
      pointer-events: none;

    @keyframes burst-center {
      0% { width: 6px; height: 6px; opacity: 1; }

    .click-burst-ray {

  <div id="root">

  <div id="custom-cursor">

  <script>
    (function () {
      var cursor = document.getElementById('custom-cursor');
      if (!cursor) return;
      var moved = false;
      var lastTrailTime = 0;
      var activeTrailDots = [];
      var MAX_TRAIL_DOTS = 14;
      var TRAIL_SPAWN_MS = 45;
      var TRAIL_LIFETIME_MS = 450;

      // idle particle emission
      var mouseX = 0;
      var mouseY = 0;
      var lastMoveTime = 0;
      var IDLE_AFTER_MS = 200;
      var IDLE_PARTICLE_MS = 90;

      // ---- accent color helpers (match user's chosen accent) ----
      function getAccentHsl() {
        var s = getComputedStyle(document.documentElement);
        var raw = (s.getPropertyValue('--accent') || '0 80% 55%').trim();
        // expected format: "H S% L%"
        var parts = raw.split(/\s+/);
        if (parts.length >= 3) {
          return {
            h: parseFloat(parts[0]) || 0,
            s: parseFloat(parts[1]) || 80,
            l: parseFloat(parts[2]) || 55
          };
        }
        return { h: 0, s: 80, l: 55 };
      }

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        var a = s * Math.min(l, 1 - l);
        function f(n) {
          var k = (n + h / 30) % 12;
          var c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * c).toString(16).padStart(2, '0');
        }
        return '#' + f(0) + f(8) + f(4);
      }

      function buildCursorSvg() {
        var a = getAccentHsl();
        var bright = hslToHex(a.h, Math.min(a.s + 5, 100), Math.min(a.l + 15, 75));
        var mid   = hslToHex(a.h, a.s, Math.max(Math.min(a.l, 55), 40));
        var deep  = hslToHex(a.h, Math.min(a.s + 10, 100), Math.max(a.l - 25, 18));

        // SIMPLE, HIGH-CONTRAST, IMPOSSIBLE-TO-MISS 4-pointed star
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
          '<defs>' +
          '<radialGradient id="g" cx="50%" cy="50%" r="50%">' +
          '<stop offset="0%" stop-color="#ffffff"/>' +
          '<stop offset="25%" stop-color="' + bright + '"/>' +
          '<stop offset="60%" stop-color="' + mid + '"/>' +
          '<stop offset="100%" stop-color="' + deep + '"/>' +
          '</radialGradient>' +
          '</defs>' +

          // Big soft colored glow behind (helps visibility)
          '<circle cx="40" cy="40" r="36" fill="' + mid + '" fill-opacity="0.25"/>' +

          // THE STAR – solid, wide enough, full opacity
          '<path d="' +
            'M40 4 ' +
            'L50 30 ' +
            'L76 40 ' +
            'L50 50 ' +
            'L40 76 ' +
            'L30 50 ' +
            'L4 40 ' +
            'L30 30 Z' +
            '" fill="url(#g)"/>' +

          // Slight darker outline so the shape always pops against any background
          '<path d="' +
            'M40 4 L50 30 L76 40 L50 50 L40 76 L30 50 L4 40 L30 30 Z' +
            '" fill="none" stroke="' + deep + '" stroke-width="1.8"/>' +

          // Clean white center
          '<circle cx="40" cy="40" r="8" fill="#ffffff"/>' +
          '</svg>';

        return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
      }

      function applyAccentToCursor() {
        var a = getAccentHsl();
        var glow1 = 'hsla(' + a.h + ', ' + a.s + '%, ' + a.l + '%, 0.95)';
        var glow2 = 'hsla(' + a.h + ', ' + a.s + '%, ' + Math.max(a.l - 10, 20) + '%, 0.6)';
        var glow3 = 'hsla(' + a.h + ', ' + a.s + '%, ' + Math.max(a.l - 20, 15) + '%, 0.35)';

        cursor.style.backgroundImage = buildCursorSvg();
        cursor.style.filter =
          'drop-shadow(0 0 5px ' + glow1 + ') ' +
          'drop-shadow(0 0 12px ' + glow2 + ') ' +
          'drop-shadow(0 0 20px ' + glow3 + ')';
      }

      // apply immediately
      var lastAccentKey = '';
      function syncAccentIfNeeded() {
        var a = getAccentHsl();
        var key = a.h + '|' + a.s + '|' + a.l;
        if (key !== lastAccentKey) {
          lastAccentKey = key;
          applyAccentToCursor();
        }
      }
      applyAccentToCursor();
      lastAccentKey = (function () {
        var a = getAccentHsl();
        return a.h + '|' + a.s + '|' + a.l;
      })();

      // watch for instant theme / accent changes
      try {
        var observer = new MutationObserver(function () {
          syncAccentIfNeeded();
        });
        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['style', 'class'],
          subtree: false
        });
        if (document.body) {
          observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['style', 'class'],
            subtree: false
          });
        }
      } catch (e) {}

      // also poll very frequently so it feels instant
      setInterval(syncAccentIfNeeded, 50);

      window.addEventListener('mousemove', function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        lastMoveTime = Date.now();

        // keep color in sync while moving
        syncAccentIfNeeded();

        cursor.style.left = mouseX + 'px';
        cursor.style.top = mouseY + 'px';
        if (!moved) {
          cursor.style.display = 'block';
          moved = true;
        }

        var now = Date.now();
        if (now - lastTrailTime > TRAIL_SPAWN_MS) {
          lastTrailTime = now;
          spawnTrailDot(mouseX, mouseY);
        }
      }, { passive: true });

      cursor.style.display = 'none';

      setInterval(function () {
        if (!moved) return;
        var now = Date.now();
        if (now - lastMoveTime >= IDLE_AFTER_MS) {
          spawnCursorParticle(mouseX, mouseY);
          if (Math.random() > 0.5) spawnCursorParticle(mouseX, mouseY);
        }
      }, IDLE_PARTICLE_MS);

      function spawnTrailDot(x, y) {
        while (activeTrailDots.length >= MAX_TRAIL_DOTS) {
          var oldest = activeTrailDots.shift();
          if (oldest && oldest.parentNode) oldest.remove();
        }
        var t = document.createElement('div');
        t.className = 'cursor-trail-dot';
        var offsetX = (Math.random() - 0.5) * 6;
        var offsetY = (Math.random() - 0.5) * 6;
        t.style.left = (x + offsetX) + 'px';
        t.style.top = (y + offsetY) + 'px';
        var size = 3 + Math.random() * 3;
        t.style.width = size + 'px';
        t.style.height = size + 'px';
        document.body.appendChild(t);
        activeTrailDots.push(t);
        setTimeout(function () {
          if (t.parentNode) t.remove();
          var idx = activeTrailDots.indexOf(t);
          if (idx !== -1) activeTrailDots.splice(idx, 1);
        }, TRAIL_LIFETIME_MS);
      }

      function spawnCursorParticle(x, y) {
        var a = getAccentHsl();
        var p = document.createElement('div');
        p.className = 'cursor-particle';
        var size = 3 + Math.random() * 5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        var angle = Math.random() * Math.PI * 2;
        var dist = 8 + Math.random() * 22;
        p.style.left = (x + Math.cos(angle) * dist) + 'px';
        p.style.top = (y + Math.sin(angle) * dist) + 'px';
        // slight lightness variation of the accent
        var l = a.l + (Math.random() * 20 - 8);
        p.style.background = 'hsl(' + a.h + ' ' + a.s + '% ' + Math.max(20, Math.min(75, l)) + '%)';
        p.style.boxShadow = '0 0 8px hsla(' + a.h + ', ' + a.s + '%, ' + a.l + '%, 0.9)';
        document.body.appendChild(p);
        setTimeout(function () {
          if (p.parentNode) p.remove();
        }, 1000);
      }

      function spawnClickBurst(x, y) {
        // lightweight burst – fewer elements for less lag
        var frag = document.createDocumentFragment();
        var elements = [];

        // center only
        var center = document.createElement('div');
        center.className = 'click-burst-center';
        center.style.cssText = 'left:' + x + 'px;top:' + y + 'px';
        frag.appendChild(center);
        elements.push(center);

        // 8 rays instead of 14, with uneven lengths for an organic flare-burst look
        var rayCount = 8;
        for (var i = 0; i < rayCount; i++) {
          var ray = document.createElement('div');
          ray.className = 'click-burst-ray';
          var angle = (360 / rayCount) * i + (Math.random() * 10 - 5);
          var len = 12 + Math.random() * 16;
          ray.style.cssText = 'left:' + x + 'px;top:' + y + 'px;height:' + len + 'px;--rot:' + angle + 'deg';
          frag.appendChild(ray);
          elements.push(ray);
        }

        // 4 particles instead of 8
        for (var j = 0; j < 4; j++) {
          var p = document.createElement('div');
          p.className = 'click-burst-particle';
          var angleP = Math.random() * 360;
          var dist = 10 + Math.random() * 14;
          var px = x + Math.cos(angleP * Math.PI / 180) * dist;
          var py = y + Math.sin(angleP * Math.PI / 180) * dist;
          p.style.cssText = 'left:' + px + 'px;top:' + py + 'px';
          frag.appendChild(p);
          elements.push(p);
        }

        document.body.appendChild(frag);

        setTimeout(function () {
          for (var k = 0; k < elements.length; k++) {
            var el = elements[k];
            if (el.parentNode) el.parentNode.removeChild(el);
          }
        }, 380);
      }

      window.addEventListener('mousedown', function (e) {
        spawnClickBurst(e.clientX, e.clientY);
      }, { passive: true });
    })();
  </script>
