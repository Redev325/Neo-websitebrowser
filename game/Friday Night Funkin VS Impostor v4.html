	<script>
/*
 * VS Impostor V4 HTML5 compatibility patch:
 * Ejected's video event can leave the game rendering a black screen during
 * the Week 2 -> Ejected transition. Remove that video event and move the
 * Ejected Start event to time zero in the chart as it is loaded.
 */
(function () {
  "use strict";
  var xhrProto = window.XMLHttpRequest && XMLHttpRequest.prototype;
  if (!xhrProto || xhrProto.__neoEjectedChartPatch) return;
  xhrProto.__neoEjectedChartPatch = true;

  var nativeOpen = xhrProto.open;
  var responseTextDescriptor = Object.getOwnPropertyDescriptor(xhrProto, "responseText");
  var responseDescriptor = Object.getOwnPropertyDescriptor(xhrProto, "response");

  function readNativeResponse(xhr, descriptor) {
    try {
      if (descriptor && typeof descriptor.get === "function") return descriptor.get.call(xhr);
      return undefined;
    } catch (_) {
      return undefined;
    }
  }

  function patchChartText(raw) {
    if (typeof raw !== "string" || !raw) return null;
    try {
      var data = JSON.parse(raw);
      var sections = data && data.song && data.song.notes;
      if (!Array.isArray(sections)) return null;

      var startEvent = null;
      var removedVideoEvent = false;
      var movedStartEvent = false;

      sections.forEach(function (section) {
        if (!section || !Array.isArray(section.sectionNotes)) return;
        section.sectionNotes = section.sectionNotes.filter(function (note) {
          var name = String(note && note[2] != null ? note[2] : "").trim().toLowerCase();
          if (name === "ejected video") {
            removedVideoEvent = true;
            return false;
          }
          if (name === "ejected start") {
            startEvent = note.slice();
            startEvent[0] = 0;
            movedStartEvent = true;
            return false;
          }
          return true;
        });
      });

      if (!removedVideoEvent || !movedStartEvent || !startEvent || !sections.length) return null;
      if (!Array.isArray(sections[0].sectionNotes)) sections[0].sectionNotes = [];
      sections[0].sectionNotes.unshift(startEvent);
      return { text: JSON.stringify(data), object: data };
    } catch (_) {
      return null;
    }
  }

  xhrProto.open = function (method, url) {
    var args = Array.prototype.slice.call(arguments);
    var isEjectedEvents = /\/assets\/data\/ejected\/events\.json(?:[?#]|$)/i.test(String(url || ""));
    var result = nativeOpen.apply(this, args);
    if (isEjectedEvents && !this.__neoEjectedChartListener) {
      this.__neoEjectedChartListener = true;
      var xhr = this;
      xhr.addEventListener("readystatechange", function () {
        if (xhr.readyState !== 4 || xhr.__neoEjectedChartPatched || xhr.status < 200 || xhr.status >= 300) return;
        var raw;
        var responseType = "";
        try { responseType = xhr.responseType || ""; } catch (_) {}
        if (responseType === "json") {
          raw = JSON.stringify(readNativeResponse(xhr, responseDescriptor));
        } else if (responseType === "" || responseType === "text") {
          raw = readNativeResponse(xhr, responseTextDescriptor);
        } else {
          return;
        }
        var patched = patchChartText(raw);
        if (!patched) return;

        try {
          Object.defineProperty(xhr, "responseText", {
            configurable: true,
            get: function () { return patched.text; }
          });
        } catch (_) {}
        try {
          Object.defineProperty(xhr, "response", {
            configurable: true,
            get: function () { return responseType === "json" ? patched.object : patched.text; }
          });
        } catch (_) {}
        xhr.__neoEjectedChartPatched = true;
      });
    }
    return result;
  };
})();
</script>

  <script>
  // HTML5 fallback for the known Ejected cutscene transition getting stuck.
  // Only send a single Enter key event when that cutscene video ends or fails.
  (function () {
    var watched = new WeakSet();
    function isEjectedVideo(video) {
      var src = String(video.currentSrc || video.src || "").toLowerCase();
      return src.indexOf("ejected.mp4") !== -1;
    }
    function continueAfterVideo() {
      var options = { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true, cancelable: true };
      try {
        document.dispatchEvent(new KeyboardEvent("keydown", options));
        window.setTimeout(function () {
          document.dispatchEvent(new KeyboardEvent("keyup", options));
        }, 80);
      } catch (_) {}
    }
    function watchVideo(video) {
      if (watched.has(video)) return;
      watched.add(video);
      function recover() {
        if (isEjectedVideo(video)) window.setTimeout(continueAfterVideo, 250);
      }
      video.addEventListener("ended", recover, { once: true });
      video.addEventListener("error", recover, { once: true });
    }
    function scanVideos() {
      document.querySelectorAll("video").forEach(watchVideo);
    }
    scanVideos();
    new MutationObserver(scanVideos).observe(document.documentElement, { childList: true, subtree: true });
  })();
  </script>
