          'html[data-neo-game-optimization] body::before,html[data-neo-game-optimization] body::after{content:none!important;display:none!important;visibility:hidden!important;background:none!important;filter:none!important;box-shadow:none!important}',
          'html[data-neo-game-optimization] .neo-browser-rain-canvas{display:none!important;opacity:0!important;filter:none!important}',
          'html[data-neo-game-viewer-optimization] [data-neo-game-viewer]{animation:none!important;transition:none!important;filter:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}',
          'html[data-neo-game-viewer-optimization] [data-neo-game-viewer] *:not(iframe):not(canvas):not(video){animation:none!important;transition:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;text-shadow:none!important}'
        ].join('');
        document.head.appendChild(style);
      }

      syncActiveState();
      window.addEventListener('neo-open-settings', queueAdd);
      document.addEventListener('click', function (event) {
        var button = event.target && event.target.closest
          ? event.target.closest('button[aria-label="Settings"]')
          : null;
        if (button) queueAdd();
      }, true);

      try {
        var root = document.getElementById('root');
        if (root) {
          new MutationObserver(function () {
            syncActiveState();
            if (!document.querySelector('[' + SETTING_ATTR + '="true"]')) addSetting();
          }).observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-neo-game-viewer'] });
        }
      } catch (_) {}

      // A slow fallback also handles viewer state changes not represented by DOM attributes.
      setInterval(syncActiveState, 1000);
      queueAdd();
    })();
  </script>

</body></html>
